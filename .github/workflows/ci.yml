name: CI

on:
  push:
    branches: [main]
  pull_request:

# Self-ingestion (Phase 12, Task 5) is deliberately not wired: posting CI
# results back into a hosted platform instance needs credentials and a
# deployment target, which this repository does not assume. The JUnit
# artifact below keeps that future integration to a small step.

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flakytestpi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/flakytestpi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --junitxml=test-results.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-junit
          path: backend/test-results.xml

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Start complete Compose stack
        run: docker compose up --build -d
      - name: Verify frontend, API proxy, and seeded demo
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ >/dev/null \
              && curl --fail --silent http://localhost:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:3000/ >/dev/null
          curl --fail --silent http://localhost:8000/api/projects >/dev/null
          docker compose exec -T backend flakyctl seed-demo
          curl --fail --silent http://localhost:3000/api/dashboard/summary \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["total_tests"] == 30'
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
